<svg xmlns="http://www.w3.org/2000/svg" width="848" height="208" viewBox="0 0 848 208">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050806"/>
      <stop offset="0.48" stop-color="#07110a"/>
      <stop offset="1" stop-color="#0c2817"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.73" cy="0.46" r="0.58">
      <stop offset="0" stop-color="#48ef78" stop-opacity="0.20"/>
      <stop offset="0.52" stop-color="#2ddc67" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#07110a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="previewFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07110a"/>
      <stop offset="0.42" stop-color="#07110a" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#07110a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="previewShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.34"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#6fff93" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="previewClip">
      <rect x="386" y="16" width="446" height="176" rx="15"/>
    </clipPath>
    <filter id="panelShadow" x="-20%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="-8" dy="7" stdDeviation="12" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
  </defs>

  <rect width="848" height="208" fill="url(#background)"/>
  <rect width="848" height="208" fill="url(#grid)"/>
  <rect width="848" height="208" fill="url(#glow)"/>
  <path d="M350 0H848V208H304Z" fill="#2ee668" fill-opacity="0.025"/>

  <g filter="url(#panelShadow)">
    <rect x="386" y="16" width="446" height="176" rx="15" fill="#0b0e0c"/>
    <g clip-path="url(#previewClip)">
      <image href="../../docs/screenshots/store.png"
             x="386" y="16" width="446" height="251"
             preserveAspectRatio="xMidYMin slice"/>
      <rect x="386" y="16" width="446" height="176" fill="url(#previewShade)"/>
    </g>
    <rect x="386.75" y="16.75" width="444.5" height="174.5" rx="14.25"
          fill="none" stroke="#64f48a" stroke-opacity="0.34" stroke-width="1.5"/>
  </g>

  <rect x="334" y="0" width="184" height="208" fill="url(#previewFade)"/>

  <image href="../img/opennow-logo-mark.png"
         x="30" y="22" width="129" height="70"
         preserveAspectRatio="xMidYMid meet"/>

  <text x="31" y="139"
        fill="#f7fff9"
        font-family="Arial, Helvetica, sans-serif"
        font-size="43"
        font-weight="700"
        letter-spacing="-1.4">OpenNOW</text>

  <rect x="32" y="153" width="39" height="3" rx="1.5" fill="#52ee7e"/>
  <text x="80" y="158"
        fill="#b6c6bc"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11.5"
        font-weight="600"
        letter-spacing="1.15">GEFORCE NOW ON SWITCH</text>

  <text x="32" y="184"
        fill="#66ee8a"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12.5"
        font-weight="600">Your cloud library. Ready to play.</text>

  <rect x="0.75" y="0.75" width="846.5" height="206.5" rx="8"
        fill="none" stroke="#69f18d" stroke-opacity="0.18" stroke-width="1.5"/>
</svg>
